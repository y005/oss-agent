[project]
name = "dl-agent"
version = "0.1.0"
description = "사내 메일링그룹(DL) 문의 대응 에이전트 — LangGraph + Qwen3-4B(llama-server)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dl_agent = ["web/*.html"]
